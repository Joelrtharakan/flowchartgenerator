name: CI/CD

on:
  push:
    branches: [master, main, "feature/**", "fix/**", "infra/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- 1. QUALITY
  lint-and-test:
    name: Lint, SAST and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Static analysis (ruff)
        run: ruff check .

      - name: Security static analysis (bandit)
        run: bandit -q -r training/app.py frontend/server.py

      - name: Unit tests with coverage
        run: pytest --cov=app --cov=server --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------- 2. IaC / MANIFEST CHECKS
  validate-infra:
    name: Validate Terraform, Kubernetes, Ansible, Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Kubernetes manifests (kustomize + kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize k8s/base | ./kubeconform -strict -summary

      - name: Ansible syntax check
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general
          printf '[flowchart]\nlocalhost ansible_connection=local\n' > /tmp/inv.ini
          ansible-playbook -i /tmp/inv.ini ansible/playbook.yml --syntax-check

      - name: Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v2.53.0 check rules /m/alerts.yml

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.api
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.frontend
          failure-threshold: error

  # ----------------------------------------- 3. BUILD, SCAN, SMOKE TEST, PUBLISH
  build-and-publish:
    name: Build, scan and publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [lint-and-test, secret-scan, validate-infra]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flowchart-api
            dockerfile: Dockerfile.api
            port: 8000
            env: "-e SKIP_MODEL_LOAD=1"
          - image: flowchart-frontend
            dockerfile: Dockerfile.frontend
            port: 8082
            env: ""
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Container smoke test
        run: |
          docker run -d --name smoke -p ${{ matrix.port }}:${{ matrix.port }} ${{ matrix.env }} ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:${{ matrix.port }}/health && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Vulnerability scan (Trivy) - fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Vulnerability scan (Trivy) - SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Keep the scan report as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif

      - name: Upload scan results to GitHub Security tab
        # Needs code scanning (public repo or GitHub Advanced Security); not fatal otherwise
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (SHA and latest tags)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}

  # ------------------------------------------------------ 4. STAGING (compose)
  deploy-staging:
    name: Deploy to staging (compose + monitoring stack check)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring up the full stack with the published images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          cat > docker-compose.staging.yml <<YAML
          services:
            api:
              image: ${REGISTRY}/${OWNER}/flowchart-api:${GITHUB_SHA}
              environment: { SKIP_MODEL_LOAD: "1" }
              ports: ["8000:8000"]
            frontend:
              image: ${REGISTRY}/${OWNER}/flowchart-frontend:${GITHUB_SHA}
              environment: { API_URL: "http://api:8000/generate" }
              ports: ["8082:8082"]
            prometheus:
              image: prom/prometheus:v2.53.0
              volumes:
                - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
              ports: ["9090:9090"]
          YAML
          docker compose -f docker-compose.staging.yml up -d

      - name: Verify services and that Prometheus scrapes the API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:8082/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/metrics | grep -q http_requests_total
          for i in $(seq 1 20); do
            curl -fsS 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22flowchart-api%22%7D' | grep -q '"1"\]' && exit 0
            sleep 3
          done
          echo "Prometheus never saw the API as up"; exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs

  # --------------------------------------------- 5. PRODUCTION (Azure VM, gated)
  deploy-production:
    name: Deploy to production (Ansible -> Azure VM)
    runs-on: ubuntu-latest
    needs: deploy-staging
    # Enable by creating the repo variable DEPLOY_ENABLED=true and the secrets below.
    # The `production` environment can be configured with required reviewers (manual approval).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general

      - name: Configure SSH access
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '[flowchart]\n${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }} ansible_ssh_private_key_file=~/.ssh/id_deploy\n' > ansible/inventory.ini

      - name: Run playbook
        working-directory: ansible
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          ansible-playbook playbook.yml \
            -e image_owner="${GITHUB_REPOSITORY_OWNER,,}" \
            -e image_tag="${GITHUB_SHA}" \
            -e ghcr_user="${GITHUB_ACTOR}" \
            -e ghcr_token="${{ secrets.GITHUB_TOKEN }}"

      - name: Post-deploy health check
        run: curl -fsS --retry 10 --retry-delay 6 --retry-connrefused "http://${{ secrets.VM_HOST }}:8000/health"
