<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics & Logs Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --bg-panel: #18181b;
            --bg-elevated: #27272a;
            --border: #3f3f46;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --brand: #6366f1;
            --brand-glow: rgba(99, 102, 241, 0.2);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --info: #3b82f6;
            --info-bg: rgba(59, 130, 246, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Placeholder */
        aside {
            width: 260px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item.active {
            background-color: var(--brand-glow);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .nav-item:hover:not(.active) {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px 32px;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 { font-size: 1.5rem; font-weight: 600; }

        .toolbar {
            display: flex;
            gap: 12px;
        }

        button {
            background-color: var(--bg-panel);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover { background-color: var(--bg-elevated); }
        button.primary { background-color: var(--brand); border-color: var(--brand); }
        button.primary:hover { background-color: #4f46e5; }
        
        .pill-btn {
            border-radius: 20px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Log Table area */
        .log-container-wrapper {
            flex: 1;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .log-header {
            display: flex;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-elevated);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .col-level { width: 100px; flex-shrink: 0; }
        .col-message { flex: 1; }

        #log-stream {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        #log-stream::-webkit-scrollbar { width: 8px; }
        #log-stream::-webkit-scrollbar-track { background: transparent; }
        #log-stream::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        #log-stream::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .log-row {
            display: flex;
            padding: 12px 24px;
            border-bottom: 1px solid rgba(63, 63, 70, 0.4);
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            transition: background-color 0.15s;
        }

        .log-row:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Level Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            font-family: 'Inter', sans-serif;
        }

        .badge-err { background: var(--error-bg); color: var(--error); border: 1px solid rgba(239,68,68,0.2); }
        .badge-warn { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
        .badge-info { background: var(--info-bg); color: var(--info); border: 1px solid rgba(59,130,246,0.2); }
        .badge-ok { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16,185,129,0.2); }
        .badge-debug { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border); }

        .log-text {
            color: #e4e4e7;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* Emphasized keys */
        .highlight-status { color: var(--success); font-weight: 600; background: var(--success-bg); padding: 0 4px; border-radius: 4px;}
        .highlight-status-err { color: var(--error); font-weight: 600; background: var(--error-bg); padding: 0 4px; border-radius: 4px;}
        .highlight-method { color: #a78bfa; font-weight: 600; }

    </style>
</head>
<body>

    <aside>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            Serverless Hub
        </div>
        <div class="nav-item active">
            <span>Live Telemetry</span>
            <div id="connection-dot" class="pulse-dot"></div>
        </div>
        <div class="nav-item" onclick="window.open('http://20.219.147.18:8000/docs', '_blank')">
            <span>Interactive Docs</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </div>
    </aside>

    <main>
        <header>
            <div>
                <h1>API Telemetry Stream</h1>
                <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 4px;">Real-time monitoring from production gateway (20.219.147.18)</p>
            </div>
            <div class="toolbar">
                <button onclick="clearLogs()">Clear Display</button>
                <button onclick="scrollToBottom()">Jump to End</button>
                <button id="stream-btn" class="primary pill-btn" onclick="toggleStream()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Streaming is ON
                </button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Log Packets Received</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Failed Requests / Errors</span>
                <span class="stat-value" id="stat-issues" style="color: var(--success);">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Last Stream Ping</span>
                <span class="stat-value" id="stat-time" style="font-size: 1.5rem; font-variant-numeric: tabular-nums;">--:--:--</span>
            </div>
        </div>

        <div class="log-container-wrapper">
            <div class="log-header">
                <div class="col-level">LEVEL</div>
                <div class="col-message">TELEMETRY DATA DUMP</div>
            </div>
            <div id="log-stream">
                <!-- Logs rendered here via JS -->
            </div>
        </div>
    </main>

    <script>
        const LOG_API = 'http://20.219.147.18:8000/logs/api';
        const streamContainer = document.getElementById('log-stream');
        const streamBtn = document.getElementById('stream-btn');
        const pulseDot = document.getElementById('connection-dot');
        const statIssues = document.getElementById('stat-issues');
        
        let isStreaming = true;
        let fetchInterval = null;
        let lastRawText = "";
        
        // Parses the raw line and attributes a tag to it
        function getLevelInfo(line) {
            const upLine = line.toUpperCase();
            if (upLine.includes('ERROR') || upLine.includes('EXCEPTION') || upLine.includes(' 500 ')) {
                return { class: 'badge-err', text: 'ERROR' };
            }
            if (upLine.includes('WARN') || upLine.includes(' 422 ') || upLine.includes(' 405 ')) {
                return { class: 'badge-warn', text: 'WARN' };
            }
            if (upLine.includes('INFO') || upLine.includes(' 200 OK')) {
                return { class: 'badge-info', text: 'INFO' };
            }
            if (upLine.includes('OK') || upLine.includes('SUCCESS') || upLine.includes('LOADED')) {
                return { class: 'badge-ok', text: 'OK' };
            }
            // For general lines like "Loading weights..."
            return { class: 'badge-debug', text: 'SYS' };
        }

        // Apply HTML styling to specific terms internally
        function formatLogText(text) {
            let formatted = text.replace(/(GET|POST|PUT|DELETE|OPTIONS)/g, '<span class="highlight-method">$&</span>');
            formatted = formatted.replace(/( 200 OK)/g, '<span class="highlight-status">$&</span>');
            formatted = formatted.replace(/( 422 Unprocessable Entity| 405 Method Not Allowed)/g, '<span class="highlight-status-err">$&</span>');
            return formatted;
        }

        async function fetchLogs() {
            if (!isStreaming) return;
            try {
                const response = await fetch(LOG_API);
                if (!response.ok) throw new Error('Network error');
                
                const rawText = await response.text();
                
                if (rawText === lastRawText) {
                    document.getElementById('stat-time').textContent = new Date().toLocaleTimeString();
                    return; 
                }
                lastRawText = rawText;
                
                const lines = rawText.split('\n').filter(l => l.trim() !== '');
                
                const isNearBottom = streamContainer.scrollHeight - streamContainer.clientHeight <= streamContainer.scrollTop + 100;
                
                renderLogs(lines);
                
                // Update Dashboard Metrics
                document.getElementById('stat-total').textContent = lines.length;
                document.getElementById('stat-time').textContent = new Date().toLocaleTimeString();
                
                const issueCount = lines.filter(l => {
                    const up = l.toUpperCase();
                    return up.includes('WARN') || up.includes('ERROR') || up.includes(' 422 ') || up.includes(' 405 ') || up.includes(' 500 ');
                }).length;

                statIssues.textContent = issueCount;
                if (issueCount > 0) {
                    statIssues.style.color = 'var(--error)';
                } else {
                    statIssues.style.color = 'var(--success)';
                }

                if (pulseDot) {
                    pulseDot.style.boxShadow = '0 0 10px var(--success)';
                    pulseDot.style.backgroundColor = 'var(--success)';
                }

                if (isNearBottom) scrollToBottom();

            } catch (err) {
                console.error(err);
                if (pulseDot) {
                    pulseDot.style.boxShadow = '0 0 10px var(--error)';
                    pulseDot.style.backgroundColor = 'var(--error)';
                }
            }
        }

        function renderLogs(lines) {
            streamContainer.innerHTML = '';
            
            if (lines.length === 0) {
                streamContainer.innerHTML = '<div style="padding: 32px; color: var(--text-secondary); text-align: center; font-family: Inter;">Waiting for incoming telemetry...</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            
            lines.forEach(line => {
                const row = document.createElement('div');
                row.className = 'log-row';
                
                const lvlInfo = getLevelInfo(line);
                
                const colLevel = document.createElement('div');
                colLevel.className = 'col-level';
                colLevel.innerHTML = `<span class="badge ${lvlInfo.class}">${lvlInfo.text}</span>`;
                
                const colMsg = document.createElement('div');
                colMsg.className = 'col-message log-text';
                colMsg.innerHTML = formatLogText(line);
                
                row.appendChild(colLevel);
                row.appendChild(colMsg);
                fragment.appendChild(row);
            });
            
            streamContainer.appendChild(fragment);
        }

        function toggleStream() {
            isStreaming = !isStreaming;
            if (isStreaming) {
                streamBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Streaming is ON`;
                streamBtn.classList.add('primary');
                pulseDot.style.animation = 'pulse 2s infinite';
                fetchLogs();
            } else {
                streamBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg> Stream PAUSED`;
                streamBtn.classList.remove('primary');
                pulseDot.style.animation = 'none';
                pulseDot.style.opacity = '0.5';
            }
        }

        function scrollToBottom() {
            streamContainer.scrollTop = streamContainer.scrollHeight;
        }

        function clearLogs() {
            streamContainer.innerHTML = '';
            lastRawText = "";
            document.getElementById('stat-total').textContent = "0";
            statIssues.textContent = "0";
            statIssues.style.color = 'var(--success)';
        }

        // Init stream
        fetchLogs();
        fetchInterval = setInterval(fetchLogs, 2500);
    </script>
</body>
</html>
