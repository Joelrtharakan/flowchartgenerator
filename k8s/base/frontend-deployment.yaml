apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: flowchart
  labels: { app: frontend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: frontend
          image: ghcr.io/joelrtharakan/flowchart-frontend:latest   # replaced by CI
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: flowchart-config }
          readinessProbe:
            httpGet: { path: /health, port: 8082 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8082 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: flowchart
spec:
  type: LoadBalancer      # use NodePort on minikube/kind
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 8082
