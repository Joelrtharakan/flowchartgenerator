apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: flowchart
  labels: { app: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/joelrtharakan/flowchart-api:latest   # replaced by CI (kustomize edit set image)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: flowchart-config }
          env:
            - name: CURRENT_MODEL_FILE
              value: /app/models/current_model.txt
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: { name: flowchart-secrets, key: HF_TOKEN, optional: true }
          volumeMounts:
            - { name: models, mountPath: /app/models }
            - { name: logs, mountPath: /app/logs }
            - { name: hf-cache, mountPath: /app/.cache }
          resources:
            requests: { cpu: "1", memory: 8Gi }
            limits:   { cpu: "4", memory: 12Gi }
          startupProbe:         # model load on CPU can take minutes
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: flowchart-models }
        - name: logs
          emptyDir: {}
        - name: hf-cache
          emptyDir: {}
